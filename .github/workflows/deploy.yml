name: Deploy Hive Backend to EC2

on:
  push:
    branches:
      - main
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Set deployment target
        id: target
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "remote_dir=hive-backend" >> "$GITHUB_OUTPUT"
            echo "ecosystem_file=ecosystem.config.cjs" >> "$GITHUB_OUTPUT"
          else
            echo "remote_dir=staging/hive-backend" >> "$GITHUB_OUTPUT"
            echo "ecosystem_file=ecosystem.staging.config.cjs" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Ensure remote directory exists
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "mkdir -p ~/${{ steps.target.outputs.remote_dir }}"

      - name: Deploy to EC2
        run: |
          rsync -avz --delete \
            --exclude '.env' --exclude '.env.*' --exclude '*.env' \
            --exclude 'logs' --exclude 'node_modules' --exclude '.github' --exclude '.secrets' \
            ./ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/${{ steps.target.outputs.remote_dir }}

      - name: Restart server
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            cd ~/${{ steps.target.outputs.remote_dir }}
            npm ci
            npx pm2 restart ${{ steps.target.outputs.ecosystem_file }} || npx pm2 start ${{ steps.target.outputs.ecosystem_file }}
          EOF
